version: "1.0.0"
merge_policy:
  pr_allowed_phase: ready
  branch_local_artifacts:
    - path: .pgmcp/state.json
      reason: "MCP workflow state — branch-local, must never reach main"
    - path: .pgmcp/deliverables.json
      reason: "MCP workflow deliverables — branch-local, must never reach main"
    - path: .pgmcp/quality_state.json
      reason: "QA baseline state — branch-local, must never reach main"

workflows:
  feature:
    phases:
      - name: research
        exit_requires:
          - id: research-doc
            type: file_glob
            required: true
            dir: docs/development
            pattern: issue*/research*.md
        instructions:
          sub_role: researcher
          phase_instructions: |
            Establish the evidence and strategy boundary for a new feature.

            [ ] Load get_issue(issue_number=N). Define the research
                boundary before drafting: document current behavior, evidence, options, risks,
                and decisions needed; do not design the solution or sequence implementation.

            [ ] Investigate direct sources at proportional depth. Cover the likely blast radius
                across production code, configuration, tests and helpers, current documentation,
                agent instructions, templates, enforcement, and downstream consumers.
                Read only standards or references that govern an affected or uncertain boundary.

            [ ] If bounded discovery delegation is useful, provide direct source paths, scope,
                exclusions, counterevidence sought, evidence format, uncertainty, and stop
                conditions. Treat its output as unverified findings; inspect decisive evidence
                yourself and retain every decision.

            [ ] Record current behavior, reusable patterns, constraints, unknowns, and expected
                outcomes. For each compatibility, migration, or breakage-sensitive boundary,
                present viable strategies with cost, risk, and consumer impact.
                Use risk-specific migration or rollback analysis only where evidence requires it.

            [ ] Obtain an explicit human Approved Strategy for every affected strategy boundary.
                "No special migration policy; preserve supported contracts" is valid when explicit.
                Stop if scope, evidence, or strategy remains ambiguous.

            [ ] Scaffold the research artifact with
                scaffold_artifact(artifact_type='research', name='research', context={...}).
                Apply the relevant DOCUMENTATION_STANDARD boundaries and add concrete source links.
                Self-check that claims are evidenced, test blast radius is explicit, and no design
                or planning commitment leaked into Research.

            [ ] Commit with git_add_or_commit(workflow_phase='research',
                message='Research findings (#N)').
                On the branch's first commit only, call git_push(set_upstream=True).

            [ ] Produce the outcome-neutral hand-over below; it is an evidence index, not approval.
          handover_template: |
            ### Feature / Research Hand-over

            #### Scope
            - Investigated feature boundary and exclusions: <summary>

            #### Deliverables
            - [Research](docs/development/issueN/research.md)
            - Material source evidence: <repository-relative Markdown links>

            #### Evidence
            - Blast radius: <code, config, tests, docs, agents/templates, consumers>
            - Approved Strategy: <boundary decisions and rationale>

            #### Open Work
            - Design questions, risks, and unknowns: <items or None>
            - Deferred work: <items or None>

            #### Review Request
            - Review requested
      - name: design
        exit_requires:
          - id: design-doc
            type: file_glob
            required: true
            dir: docs/development
            pattern: issue*/design*.md
        instructions:
          sub_role: designer
          phase_instructions: |
            Turn approved Feature research into an implementable technical design.

            [ ] Load the Research artifact, and its Approved Strategy.
                Define the design boundary before drafting: own architecture, interfaces,
                data/control flow, failure behavior, test design, and alternatives; do not write
                implementation steps, cycle sequencing, or production code.

            [ ] Inspect the affected implementation and test seams directly. Read the applicable
                Architecture Principles and Documentation Standard sections; load other references
                only when a material boundary is uncertain.

            [ ] Develop viable options and compare trade-offs. Select a direction that implements
                the Approved Strategy without changing it. Cover contracts, dependencies, state,
                errors, observability, and conditional migration/rollback behavior where relevant.

            [ ] Design test code as first-class code under the same architecture, typing, public
                boundary, maintainability, and review standards. Specify durable behavior or
                invariant coverage, identify existing tests to adapt, and reject ceremony-only or
                implementation-detail regression tests with no lasting value.

            [ ] If bounded discovery is delegated, provide direct sources, alternatives and
                counterevidence to seek, scope, evidence output, uncertainty, and stop conditions.
                Verify its findings yourself. Optional adversarial preflight is findings-only and
                cannot approve the design.

            [ ] Stop for a human decision if the Approved Strategy is missing, evidence makes it
                unsound, or a major design choice cannot be resolved from approved constraints.

            [ ] Scaffold the design artifact with
                scaffold_artifact(artifact_type='design', name='design', context={...}).
                Record the chosen direction, rejected alternatives, production and test design,
                validation obligations, risks, and planning consequences with source links.
                Self-check phase and document boundaries.

            [ ] Commit with git_add_or_commit(workflow_phase='design',
                message='Design for #N').

            [ ] Produce the outcome-neutral hand-over below. Independent QA determines GO/NOGO.
          handover_template: |
            ### Feature / Design Hand-over

            #### Scope
            - Designed feature boundary and exclusions: <summary>

            #### Deliverables
            - [Design](docs/development/issueN/design.md)
            - [Research](docs/development/issueN/research.md)
            - Key implementation/test seams: <repository-relative Markdown links>

            #### Evidence
            - Approved Strategy alignment: <mapping>
            - Chosen direction and rejected alternatives: <summary>
            - Durable test and validation design: <summary>

            #### Open Work
            - Planning constraints, risks, and questions: <items or None>
            - Deferred work: <items or None>

            #### Review Request
            - Review requested
      - name: planning
        exit_requires:
          - id: planning-doc
            type: file_glob
            required: true
            dir: docs/development
            pattern: issue*/planning*.md
        instructions:
          sub_role: planner
          phase_instructions: |
            Convert the approved Feature design into executable, dependency-ordered cycles.

            [ ] Load Research, Design, Approved Strategy, and current project
                plan. Define the planning boundary before drafting: own work slicing,
                dependencies, deliverables, verification, and stop/go criteria; do not redesign
                the solution or implement it.

            [ ] Inspect affected production and test seams as needed. Read only the Architecture,
                Documentation, typing, or other standards that govern planned work.

            [ ] Slice the feature into the smallest coherent cycles. For each cycle record scope
                and exclusions, production and test files or seams, dependencies, deliverable IDs,
                Approved Strategy obligations, failure/stop conditions, and exact exit evidence.

            [ ] Choose test mechanics by change type and risk. Require RED → GREEN → REFACTOR for
                behavior changes needing durable coverage; do not manufacture RED tests for
                mechanical, documentation-only, or test-maintenance work. Prefer adapting valuable
                tests and remove or avoid workflow-only ballast. Hold test code to production
                architecture, typing, and quality standards.

            [ ] Assign the narrowest useful tests and file-scoped gates per cycle. Reserve one
                workspace-wide test run and branch-wide gates for Validation; do not repeat fresh
                evidence without an invalidating change.

            [ ] If planning discovery is delegated, provide direct artifacts and source paths,
                bounded questions, exclusions, evidence output, uncertainty, and stop conditions.
                Verify results yourself; delegated preflight returns findings-only.

            [ ] Stop if Design or Approved Strategy is ambiguous, contradicted, or requires change.

            [ ] Scaffold the plan with
                scaffold_artifact(artifact_type='planning', name='planning', context={...}).
                Apply Documentation Standard boundaries and keep document cycles identical to the
                structured payload. Save them with save_planning_deliverables(issue_number=N,
                cycles={...}, deliverables=[...]) after verifying IDs, ordering, and dependencies.

            [ ] Commit with git_add_or_commit(workflow_phase='planning',
                message='Planning for #N').

            [ ] Produce the outcome-neutral hand-over below. Independent QA determines GO/NOGO.
          handover_template: |
            ### Feature / Planning Hand-over

            #### Scope
            - Planned feature work and exclusions: <summary>

            #### Deliverables
            - [Planning](docs/development/issueN/planning.md)
            - [Design](docs/development/issueN/design.md)
            - [Research](docs/development/issueN/research.md)

            #### Evidence
            - Cycle/deliverable mapping and dependencies: <summary>
            - Test and gate strategy: <durable, proportional evidence>
            - Structured payload saved: <tool outcome>

            #### Open Work
            - Implementation blockers, risks, and questions: <items or None>
            - Deferred work: <items or None>

            #### Review Request
            - Review requested
      - name: implementation
        cycle_based: true
        subphases: [red, green, refactor]
        commit_type_map:
          red: test
          green: feat
          refactor: refactor
        exit_requires: []
        instructions:
          sub_role: implementer
          phase_instructions: |
            Execute the active Feature cycle exactly as approved.

            [ ] Load get_project_plan(issue_number=N). Identify the active
                cycle, its deliverables, prerequisites, exclusions, Approved Strategy constraints,
                and stop conditions. Stop on missing or contradictory context; do not redesign,
                re-plan, or silently change strategy.

            [ ] Inspect the direct production and test seams for this cycle. If execution is
                delegated, provide the bounded task, authoritative artifacts and paths, exclusions,
                expected evidence, uncertainty, and stop conditions. Verify all output and retain
                integration and progression decisions.

            [ ] Treat production code, tests, fixtures, and helpers as first-class code under the
                same architecture, typing, public-boundary, maintainability, and quality standards.

            [ ] Apply the cycle's planned test mode:
                - behavior/durable-gap cycle: add or adapt the failing durable test, run its
                  narrow scope to confirm the intended RED, then commit with sub_phase='red'
                - mechanical or test-maintenance cycle: do not create an artificial RED; record
                  the plan's rationale and protect existing behavior with the narrowest useful test
                - GREEN: implement only the cycle scope, run focused tests, and commit with
                  sub_phase='green'
                - REFACTOR: apply only planned cleanup, rerun affected tests and file-scoped gates,
                  and commit with sub_phase='refactor' only when cleanup changed files

            [ ] Use run_tests(path='<focused scope>') and
                run_quality_gates(scope='files', files=[...]) proportionally. Do not run the full
                suite here; Validation owns the workspace-wide run.

            [ ] Perform a producer self-check against cycle deliverables, direct diff evidence,
                architecture, and Approved Strategy. An optional adversarial preflight must seek
                violations and counterexamples and return findings-only; it cannot issue PASS/GO
                or authorize progression. Resolve material findings yourself.

            [ ] When objective cycle evidence is satisfied and more cycles remain, call
                transition_cycle(to_cycle=N+1).
                Continue only under the next instruction.
                After the final cycle, do not transition phase autonomously; produce the hand-over
                below and request independent review.
          handover_template: |
            ### Feature / Implementation Hand-over

            #### Scope
            - Executed cycles and exclusions: <summary>

            #### Deliverables
            - Planning deliverables satisfied: <IDs with links>
            - Primary production review entry points: <repository-relative Markdown links>
            - Primary tests: <repository-relative Markdown links>
            - Complete inventory: <branch diff reference; group remaining files>

            #### Evidence
            - Focused tests and file-scoped gates: <exact calls and outcomes>
            - Approved Strategy and architecture preservation: <mapping>

            #### Open Work
            - Blockers, residual risks, and deferred work: <items or None>
            - Remaining cycles: <items or None>

            #### Review Request
            - Review requested
      - name: validation
        exit_requires:
          - id: validation-report
            type: file_glob
            required: true
            dir: docs/development
            pattern: issue*/validation*.md
        instructions:
          sub_role: validator
          phase_instructions: |
            Produce branch-wide Feature verification after all implementation cycles.

            [ ] Load get_project_plan(issue_number=N), Research, Design,
                Planning, Approved Strategy, and the implementation hand-over. Read only the
                standards needed to judge affected boundaries. Stop if implementation is
                incomplete or the approved inputs conflict; Validation does not redesign or patch.

            [ ] Map every planned deliverable, design constraint, strategy obligation, and
                high-risk production/test surface to observable evidence.

            [ ] Run the single workspace-wide suite with run_tests(scope='full') and branch-wide
                gates with run_quality_gates(scope='branch'). Reuse nothing stale; if a check
                fails, preserve exact evidence and report FAIL rather than weakening criteria.

            [ ] Add targeted validation only for a material gap not covered by the full checks.
                Do not add permanent tests for temporary diagnosis or workflow ceremony.
                Propose a safe live demonstration when the feature has an observable runtime path;
                otherwise provide the closest reviewable evidence and rationale.

            [ ] Identify residual risk, limitations, and deferred work explicitly, including
                findings that Ready must transfer for @co triage.

            [ ] Create the validation artifact if absent with
                scaffold_artifact(artifact_type='validation_report', name='validation',
                context={...}); otherwise update the existing phase artifact.
                Record scope, exact outcomes, deliverable mapping, Design and Approved Strategy
                alignment, demonstration/fallback, failures, caveats, and deferred work.
                Do not claim independent QA approval.

            [ ] Commit with git_add_or_commit(workflow_phase='validation',
                message='Validation for #N').

            [ ] Produce the outcome-neutral hand-over below. Independent QA reads direct evidence
                and alone determines GO/NOGO.
          handover_template: |
            ### Feature / Validation Hand-over

            #### Scope
            - Validated branch behavior and exclusions: <summary>

            #### Deliverables
            - [Validation report](docs/development/issueN/validation.md)
            - [Planning](docs/development/issueN/planning.md)
            - Primary test/runtime evidence: <repository-relative Markdown links>

            #### Evidence
            - Workspace-wide tests: <exact outcome>
            - Branch quality gates: <exact outcome>
            - Deliverable, Design, and Approved Strategy mapping: <summary>

            #### Open Work
            - Failures, risks, limitations, and deferred work: <items or None>
            - Demonstration or fallback: <steps/link>

            #### Review Request
            - Review requested
      - name: documentation
        instructions:
          sub_role: documenter
          phase_instructions: |
            Reconcile current Feature documentation with validated behavior.

            [ ] Load get_project_plan(issue_number=N), and the Validation report.
                Treat validated behavior as the claims boundary. Read the applicable Documentation
                Standard sections before editing; load other references only when needed.

            [ ] Inventory the active documentation blast radius: READMEs, references, standards,
                runbooks, examples, diagrams, prompts, templates, navigation, and authoritative
                agent instructions plus derived consumers. Issue-local and archived artifacts are
                context by default, not edit targets, unless explicitly authoritative or planned.

            [ ] Update the smallest complete set of current docs. For source-consumer assets,
                edit the authoritative source first, synchronize consumers, and verify parity.
                Keep commands, links, diagrams, terminology, examples, and limitations aligned
                with Validation evidence. Record material surfaces reviewed but unchanged.

            [ ] Do not change production behavior or invent unsupported claims in Documentation.
                If the scan exposes an implementation gap, strategy conflict, or new scope
                decision, stop and report it. Capture genuine deferred documentation work for
                Ready rather than hiding it.

            [ ] Run only checks invalidated by documentation changes, such as link, template,
                source-parity, or focused documentation tests. Do not repeat fresh implementation
                tests or branch gates without an invalidating change.

            [ ] Commit with git_add_or_commit(workflow_phase='documentation',
                message='Documentation for #N').

            [ ] Produce the outcome-neutral hand-over below.
          handover_template: |
            ### Feature / Documentation Hand-over

            #### Scope
            - Reconciled current documentation and exclusions: <summary>

            #### Deliverables
            - Updated current docs: <repository-relative Markdown links>
            - Authoritative agent/template sources and consumers: <links or None>
            - [Validation report](docs/development/issueN/validation.md)

            #### Evidence
            - Documentation, link, template, or parity checks: <exact outcomes>
            - Reviewed but unchanged surfaces: <links and rationale>

            #### Open Work
            - Residual caveats and deferred documentation work: <items or None>

            #### Review Request
            - Review requested
      - name: ready
        instructions:
          sub_role: implementer
          phase_instructions: |
            Prepare and submit the pull request from verified branch evidence.

            [ ] Load get_project_plan(issue_number=N).
                Inspect the issue, Validation evidence, and current documentation only as needed
                to verify delivered scope and the final pull-request narrative.

            [ ] Establish evidence freshness:
                - reuse successful Validation tests and gates when no later change invalidated them
                - rerun only invalidated checks at the narrowest sufficient scope
                - repeat the workspace-wide suite only when its evidence is stale or missing
                - stop on any unresolved failure

            [ ] Inspect the final branch:
                - git_status()
                - git_diff_stat(target_branch='<parent>', source_branch='HEAD')
                - confirm intended scope, complete tracked branch state, and no unrelated,
                  temporary, generated, missing, or uncommitted files

            [ ] Derive deferred work from Validation, phase artifacts, and the final diff.
                For each item record the finding, why it is excluded, impact, source,
                recommended follow-up, and existing issue reference or @co triage need.
                Record "None identified" when the search finds none.

            [ ] Scaffold the PR body:
                scaffold_artifact(artifact_type='pr', name='pr', context={...}).
                Include delivered scope, exact verification evidence, closure claims,
                residual risks, deferred work, tracking state, and links to primary artifacts.
                Use only supported claims; stop if scope or closure intent is ambiguous.

            [ ] If tracked workflow state or intended changes remain, commit them:
                git_add_or_commit(workflow_phase='ready',
                message='chore: update branch state before PR').
                Recheck git_status() and stop unless the branch is clean.

            [ ] Submit the PR:
                submit_pr(head='<branch>', title='<title>', body='<scaffolded PR body>').

            [ ] Produce the outcome-neutral hand-over below.
          handover_template: |
            ### Ready Hand-over

            #### Scope
            - Issue and delivered scope: <#N and concise outcome>
            - Excluded scope: <items or None>

            #### Deliverables
            - Pull request: [PR #N](PR_URL)
            - Primary phase artifact: [artifact](repository/relative/path.md)

            #### Evidence
            - Validation evidence reused or rerun: <checks and outcomes>
            - Final branch status and diff: <outcome>

            #### Open Work
            - Deferred work and tracking state: <items or None identified>
            - Residual risks or blockers: <items or None>

            #### Review Request
            - Review requested
  bug:
    phases:
      - name: research
        exit_requires:
          - id: research-doc
            type: file_glob
            required: true
            dir: docs/development
            pattern: issue*/research*.md
        instructions:
          sub_role: researcher
          phase_instructions: |
            Establish reproducible defect evidence, root cause, and strategy boundaries.

            [ ] Load get_issue(issue_number=N). Define the Research
                boundary before drafting: own observed versus expected behavior, reproduction,
                causal evidence, blast radius, and strategy choices; do not select the fix,
                design its structure, or sequence implementation.

            [ ] Reproduce or otherwise evidence the failure through direct code, configuration,
                logs, tests, and call paths. Distinguish root cause from symptoms and record
                conditions where the defect does and does not occur.

            [ ] Map proportional blast radius across production code, configuration, tests,
                helpers/fixtures, current docs, agent instructions/templates, enforcement, and
                consumers. Read only standards or references governing an affected or uncertain
                boundary.

            [ ] If bounded discovery is delegated, give direct source paths, reproduction facts,
                competing causal hypotheses, counterevidence sought, scope/exclusions, evidence
                output, uncertainty, and stop conditions. Verify decisive evidence yourself.

            [ ] Identify corrected-behavior and regression boundaries. For compatibility,
                migration, or breakage-sensitive consumers, present strategies with cost, risk,
                and impact. Analyze rollback/migration only when defect evidence requires it.

            [ ] Obtain an explicit human Approved Strategy per affected boundary. Stop if the
                defect is not evidenced, root cause remains materially ambiguous, issue scope
                must change, or strategy is undecided.

            [ ] Scaffold the research artifact with
                scaffold_artifact(artifact_type='research', name='research', context={...}).
                Apply relevant Documentation Standard boundaries; link evidence and state
                reproduction, root cause, blast radius, corrected behavior, risks, and strategy.
                Keep fix design and planning out.

            [ ] Commit with git_add_or_commit(workflow_phase='research',
                message='Research findings (#N)').
                On the branch's first commit only, call git_push(set_upstream=True).

            [ ] Produce the outcome-neutral hand-over below.
          handover_template: |
            ### Bug / Research Hand-over

            #### Scope
            - Investigated defect and exclusions: <summary>

            #### Deliverables
            - [Research](docs/development/issueN/research.md)
            - Reproduction/root-cause evidence: <repository-relative Markdown links>

            #### Evidence
            - Observed versus expected behavior: <summary>
            - Root cause and blast radius: <code, config, tests, docs, agents/consumers>
            - Approved Strategy: <boundary decisions and rationale>

            #### Open Work
            - Design questions, regression risks, and unknowns: <items or None>
            - Deferred work: <items or None>

            #### Review Request
            - Review requested
      - name: design
        exit_requires:
          - id: design-doc
            type: file_glob
            required: true
            dir: docs/development
            pattern: issue*/design*.md
        instructions:
          sub_role: designer
          phase_instructions: |
            Design the smallest robust correction for the evidenced defect.

            [ ] Load Bug Research, root-cause evidence, corrected behavior,
                and Approved Strategy. Define the Design boundary before drafting: own correction
                architecture, interfaces, failure behavior, regression design, and alternatives;
                do not write cycle sequencing or implementation steps.

            [ ] Inspect the causal production and test seams directly. Read applicable Architecture
                and Documentation Standard sections; load other references only for uncertain
                affected boundaries.

            [ ] Compare viable corrections. Select the smallest direction that removes root cause,
                not only symptoms, while preserving supported behavior and Approved Strategy.
                Cover contracts, state, dependencies, errors, observability, and conditional
                containment/migration/rollback where evidence requires it.

            [ ] Design regression coverage as first-class test code. Prefer adapting an existing
                durable test; otherwise protect stable corrected behavior or an invariant through
                public boundaries. Reject temporary reproduction scripts, implementation-detail
                assertions, and tests whose only value is this workflow.

            [ ] If discovery or adversarial preflight is delegated, provide direct sources,
                causal alternatives/counterexamples, bounded scope, evidence output, uncertainty,
                and stop conditions. It returns findings-only; verify and decide yourself.

            [ ] Stop for human decision if root cause, corrected behavior, or Approved Strategy is
                missing, contradicted, or made unsound by new evidence.

            [ ] Scaffold the design artifact with
                scaffold_artifact(artifact_type='design', name='design', context={...}).
                Record chosen correction, rejected alternatives, production/test design,
                preservation obligations, validation evidence, and planning consequences.
                Self-check phase and document boundaries.

            [ ] Commit with git_add_or_commit(workflow_phase='design',
                message='Design for #N').

            [ ] Produce the outcome-neutral hand-over below. Independent QA determines GO/NOGO.
          handover_template: |
            ### Bug / Design Hand-over

            #### Scope
            - Designed defect correction and exclusions: <summary>

            #### Deliverables
            - [Design](docs/development/issueN/design.md)
            - [Research](docs/development/issueN/research.md)
            - Causal production/test seams: <repository-relative Markdown links>

            #### Evidence
            - Root-cause and corrected-behavior alignment: <mapping>
            - Approved Strategy and preservation alignment: <mapping>
            - Durable regression design: <summary>

            #### Open Work
            - Planning constraints, risks, and questions: <items or None>
            - Deferred work: <items or None>

            #### Review Request
            - Review requested
      - name: planning
        exit_requires:
          - id: planning-doc
            type: file_glob
            required: true
            dir: docs/development
            pattern: issue*/planning*.md
        instructions:
          sub_role: planner
          phase_instructions: |
            Convert the approved bug correction into minimal, dependency-ordered cycles.

            [ ] Load Research, Design, root cause, corrected behavior,
                Approved Strategy, and current project plan. Define the Planning boundary:
                own slicing, dependencies, deliverables, verification, and stop/go criteria;
                do not redesign or implement the correction.

            [ ] Inspect affected production/test seams as needed and read only standards governing
                planned work.

            [ ] Slice root-cause correction, call-site migration when applicable, regression
                coverage, and cleanup into the smallest coherent cycles. Record per cycle:
                scope/exclusions, files or seams, dependencies, deliverable IDs, preservation and
                strategy obligations, failure/stop conditions, and exact exit evidence.

            [ ] Default behavior correction to a durable failing regression or characterization
                test before GREEN. Reuse or adapt existing coverage where it already exposes the
                defect. Do not retain temporary diagnostic or implementation-detail tests.
                Mechanical cleanup without behavior change needs no artificial RED.
                Hold all test code to production architecture, typing, and quality standards.

            [ ] Assign focused tests and file gates per cycle. Reserve one workspace-wide test run
                and branch-wide gates for Validation; repeat evidence only after invalidation.

            [ ] Conditional delegated discovery receives direct artifacts/paths, bounded causal or
                sequencing questions, exclusions, evidence output, uncertainty, and stops.
                Producer verification and decisions remain mandatory; preflight is findings-only.

            [ ] Stop if Root Cause, Design, corrected behavior, or Approved Strategy conflicts.

            [ ] Scaffold Planning with
                scaffold_artifact(artifact_type='planning', name='planning', context={...}).
                Keep document cycles identical to save_planning_deliverables(issue_number=N,
                cycles={...}, deliverables=[...]); verify IDs, ordering, dependencies, regression
                value, and cleanup ownership before saving.

            [ ] Commit with git_add_or_commit(workflow_phase='planning',
                message='Planning for #N').

            [ ] Produce the outcome-neutral hand-over below. Independent QA determines GO/NOGO.
          handover_template: |
            ### Bug / Planning Hand-over

            #### Scope
            - Planned defect-correction work and exclusions: <summary>

            #### Deliverables
            - [Planning](docs/development/issueN/planning.md)
            - [Design](docs/development/issueN/design.md)
            - [Research](docs/development/issueN/research.md)

            #### Evidence
            - Root-cause-to-cycle/deliverable mapping: <summary>
            - Durable regression and gate strategy: <summary>
            - Structured payload saved: <tool outcome>

            #### Open Work
            - Implementation blockers, regression risks, and questions: <items or None>
            - Deferred work: <items or None>

            #### Review Request
            - Review requested
      - name: implementation
        cycle_based: true
        subphases: [red, green, refactor]
        commit_type_map:
          red: test
          green: feat
          refactor: refactor
        exit_requires: []
        instructions:
          sub_role: implementer
          phase_instructions: |
            Execute the active Bug cycle against root cause and corrected behavior.

            [ ] Load get_project_plan(issue_number=N). Identify the active
                cycle, causal target, deliverables, prerequisites, exclusions, preservation and
                Approved Strategy constraints, and stop conditions. Stop on contradiction or
                missing evidence; do not redesign, re-plan, or broaden the fix.

            [ ] Inspect direct production and test seams. Bounded execution delegation must receive
                authoritative artifacts/paths, task scope/exclusions, expected evidence,
                uncertainty, and stops. Verify output and retain integration/progression decisions.

            [ ] Treat production code, regression tests, fixtures, and helpers as first-class code
                under the same architecture, typing, public-boundary, maintainability, and quality
                standards.

            [ ] Apply the planned test mode:
                - behavior correction: add or adapt the durable failing regression or
                  characterization, run its narrow scope, confirm the intended RED, and commit
                  sub_phase='red'
                - existing test already fails for root cause: use it as RED evidence; do not add a
                  duplicate
                - mechanical cleanup/test maintenance: no artificial RED; record plan rationale
                - GREEN: minimally remove root cause, run focused affected tests, commit
                  sub_phase='green'
                - REFACTOR: only planned cleanup; rerun affected tests and file gates, commit
                  sub_phase='refactor' only when files changed

            [ ] Use run_tests(path='<focused scope>') and

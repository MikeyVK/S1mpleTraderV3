                or unrelated refactoring.
            [ ] Preserve the architecture contracts and keep workflow-dependent behavior
                configuration-driven.
            [ ] Add or update only the tests needed to prove changed behavior.
                This phase is not cycle-based and does not require RED, GREEN,
                and REFACTOR commits.
            [ ] Update directly coupled configuration, fixtures, generated copies,
                or current documentation when required for repository consistency.
            [ ] Run focused tests after each coherent change and inspect the resulting diff
                for accidental or unrelated modifications.
            [ ] Stop and return the decision to the user when new evidence changes
                the approved scope, compatibility strategy, or risk profile.
            [ ] Commit the coherent implementation through git_add_or_commit.
            [ ] Finish with an implementation handover containing scope, changed files,
                satisfied deliverables, and exact verification results.
                Stop and await the user's instruction before transitioning.

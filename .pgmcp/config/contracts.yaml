                findings/uncertainty, exclusions, and stop conditions; verify output.
                Producer-owned review cannot return a verdict or drive progression.

            [ ] Call scaffold_artifact(artifact_type='design', name='design') and complete
                Design. Verify Research/Planning/strategy
                traceability, child usability, architecture/test quality, coordination
                consequences, and applicable Documentation Standard compliance.
                Commit with git_add_or_commit(workflow_phase='design',
                message='Design for #N').

            [ ] Stop with the outcome-neutral review index below.
                Fresh independent design QA reads workspace evidence and owns GO/NOGO.
          handover_template: |
            ### Scope
            - Epic design boundary, direction, and exclusions: <summary>

            ### Deliverables
            - Design: [design](docs/development/issueN/design.md)
            - Planning: [planning](docs/development/issueN/planning.md)
            - Shared contracts/test architecture and child seams: <clickable links>

            ### Evidence
            - Alternatives, strategy alignment, risks, and standards: <summary>

            ### Open Work
            - Child/coordination constraints or blockers: <items or None>

            ### Review Request
            - Review requested
      - name: coordination
        exit_requires: []
        instructions:
          sub_role: epic-coordinator
          phase_instructions: |
            Coordinate approved epic work; never implement child technical scope.

            [ ] Load Planning, Design, and authoritative child state.
                Verify incoming hand-overs as claims.
            [ ] Reconcile ownership, status, dependencies, shared contracts/tests,
                Approved Strategy, integration gates, and blockers.
                Make only epic-owned tracking updates through configured lifecycle
                contracts; route technical work and findings to their owner.
            [ ] Record decisions, hand-offs, blockers, deferred work, and next owners.
                Stop on scope/strategy conflict or required human decision.
            [ ] Stop with the outcome-neutral hand-over.
          handover_template: |
            ### Scope
            - Epic and coordination window: <#N and scope>

            ### Deliverables
            - Child issues/status: <clickable issue links>

            ### Evidence
            - Dependencies, gates, hand-offs, and updates: <summary>

            ### Open Work
            - Blockers, deferred work, actions, and owners: <items or None>

            ### Review Request
            - Review requested
      - name: documentation
        instructions:
          sub_role: epic-documenter
          phase_instructions: |
            Reconcile current epic-level documentation after coordination.

            [ ] Load Planning, Design, coordination evidence,
                and relevant child outcomes. Check the applicable Documentation Standard.
                Treat child artifacts/history as context unless they are active sources.

            [ ] Identify invalidated epic overviews, shared contract/boundary docs,
                diagrams, rollout/stakeholder guidance, examples, cross-links,
                agent instructions, and source-consumer copies.
                Stop on new scope/strategy decisions or unsupported child claims.

            [ ] Update the smallest coherent current surface.
                Trace every claim to Planning, Design, coordination, or verified child
                evidence. Update authoritative sources first and synchronize consumers.
                Record reviewed-but-unchanged surfaces when useful.

            [ ] Verify only invalidated links, diagrams, examples, terminology,
                templates, rendering, and source-consumer/child-boundary consistency.
                Capture deferred epic documentation work explicitly.

            [ ] Self-check scope, current-state accuracy, source authority,
                Documentation Standard compliance, and absence of contradicted child
                boundaries. Commit with git_add_or_commit(
                workflow_phase='documentation', message='Documentation for #N').

            [ ] Stop with the outcome-neutral review index below.
                Fresh independent documentation QA owns any GO/NOGO verdict.
          handover_template: |
            ### Scope
            - Epic documentation outcome and exclusions: <summary>

            ### Deliverables
            - Updated epic documentation and consumers: <clickable links>
            - Planning/Design/child evidence: <clickable review inputs>

            ### Evidence
            - Focused documentation and consistency checks: <tools/outcomes>
            - Reviewed but unchanged: <surfaces and rationale or None>

            ### Open Work
            - Deferred work, ownership caveats, or blockers: <items or None>

            ### Review Request
            - Review requested
      - name: ready
        instructions:
          sub_role: epic-releaser
          phase_instructions: |
            Prepare and submit the pull request from verified branch evidence.

            [ ] Load get_project_plan(issue_number=N).
                Inspect the issue, Validation evidence, and current documentation only as needed
                to verify delivered scope and the final pull-request narrative.

            [ ] Establish evidence freshness:
                - reuse successful Validation tests and gates when no later change invalidated them
                - rerun only invalidated checks at the narrowest sufficient scope
                - repeat the workspace-wide suite only when its evidence is stale or missing
                - stop on any unresolved failure

            [ ] Inspect the final branch:
                - git_status()
                - git_diff_stat(target_branch='<parent>', source_branch='HEAD')
                - confirm intended scope, complete tracked branch state, and no unrelated,
                  temporary, generated, missing, or uncommitted files

            [ ] Derive deferred work from Validation, phase artifacts, and the final diff.
                For each item record the finding, why it is excluded, impact, source,
                recommended follow-up, and existing issue reference or @co triage need.
                Record "None identified" when the search finds none.

            [ ] Scaffold the PR body:
                scaffold_artifact(artifact_type='pr', name='pr', context={...}).
                Include delivered scope, exact verification evidence, closure claims,
                residual risks, deferred work, tracking state, and links to primary artifacts.
                Use only supported claims; stop if scope or closure intent is ambiguous.

            [ ] If tracked workflow state or intended changes remain, commit them:
                git_add_or_commit(workflow_phase='ready',
                message='chore: update branch state before PR').
                Recheck git_status() and stop unless the branch is clean.

            [ ] Submit the PR:
                submit_pr(head='<branch>', title='<title>', body='<scaffolded PR body>').

            [ ] Produce the outcome-neutral hand-over below.
          handover_template: |
            ### Ready Hand-over

            #### Scope
            - Issue and delivered scope: <#N and concise outcome>
            - Excluded scope: <items or None>

            #### Deliverables
            - Pull request: [PR #N](PR_URL)
            - Primary phase artifact: [artifact](repository/relative/path.md)

            #### Evidence
            - Validation evidence reused or rerun: <checks and outcomes>
            - Final branch status and diff: <outcome>

            #### Open Work
            - Deferred work and tracking state: <items or None identified>
            - Residual risks or blockers: <items or None>

            #### Review Request
            - Review requested

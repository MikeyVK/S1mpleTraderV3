        instructions:
          sub_role: epic-researcher
          phase_instructions: |
            Establish evidence and approved strategy for an initiative spanning child work.

            [ ] Load get_issue(issue_number=N).
                Before drafting define in-scope initiative outcomes/workstreams,
                out-of-scope decomposition/implementation, and unresolved decisions.

            [ ] Inspect a proportional blast radius across systems, code/config boundaries,
                shared tests/helpers, current docs, agent instructions/templates/enforcement,
                stakeholder surfaces, and active consumers.
                Identify reusable patterns, dependencies, sequencing constraints,
                ownership edges, and shared integration/contract/acceptance suites.

            [ ] Check applicable Architecture and Documentation Standard sections.
                Read other references or external sources only for a material uncertainty.
                Bounded discovery must seek alternatives/counterevidence, cite direct
                sources, expose uncertainty/exclusions, stop on conflict, and leave
                all decisions with the producer.

            [ ] For each strategy-sensitive shared boundary, present viable compatibility,
                migration, cutover, or containment options with cost/risk/impact.
                Obtain and capture human Approved Strategy.
                Stop if the epic must be narrowed, split, reframed, or lacks a decision.

            [ ] Call scaffold_artifact(artifact_type='research', name='research') and complete
                Research with initiative framing, candidate
                workstreams, blast radius, dependencies, shared proof obligations,
                assumptions/risks, Approved Strategy, and expected Planning inputs.
                Keep child issue creation, selected decomposition, design, and execution out.

            [ ] Verify evidence traceability, boundary discipline, and applicable
                Documentation Standard compliance. Commit with
                git_add_or_commit(workflow_phase='research',
                message='Research findings (#N)').

            [ ] Stop with the outcome-neutral hand-over below.

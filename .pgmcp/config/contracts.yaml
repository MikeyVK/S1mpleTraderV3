    phases:
      - name: planning
        exit_requires:
          - id: planning-doc
            type: file_glob
            required: true
            dir: docs/development
            pattern: issue*/planning*.md
        instructions:
          sub_role: planner
          phase_instructions: |
            [ ] Read the issue: get_issue(issue_number=N).
            [ ] Read DOCUMENTATION_STANDARD.md before drafting or scaffolding the planning document.
            [ ] Use explore_subagent to gather concrete evidence about this documentation planning task.
                Ask it to identify:
                - the documentation files, sections, examples, diagrams, and references likely affected
                - the authoritative source files or documents each planned update must rely on
                - dependencies or ordering constraints between documentation tasks
                - terminology, link, diagram, or example consistency risks
                - unknowns that would make the documentation phase discover planning mistakes too late

            [ ] Interaction checkpoint: present the planning framing to the user before going deeper.
                Include:
                - the proposed documentation scope and target files
                - the authoritative source documents or code surfaces expected to inform the updates
                - the highest-risk dependencies, consistency risks, or review-sensitive areas
                - major unknowns still blocking a sound plan
                Ask whether any audience, release, or communication constraint
                should influence the documentation task breakdown.

            [ ] Keep the planning in-bounds while forming the planning nucleus and before scaffolding:
                - Include documentation task breakdown, target files, authoritative sources,
                  dependencies, ordering, review criteria, examples or diagrams to update,
                  terminology alignment, assumptions, open questions, risks,
                  and out-of-scope notes.
                - Exclude implementation TDD cycles, save_planning_deliverables payloads,
                  production code plans, redesign decisions, and undocumented claims
                  about system behavior.
                - If the plan exposes a missing source of truth, a product contradiction,
                  or a design or research gap, stop and activate a human-in-the-loop checkpoint
                  instead of inventing the missing decision in planning.

            [ ] Before scaffolding, produce a short planning nucleus that is stable enough
                for first-time-right drafting.
                It must contain:
                - the target documentation scope and intended outcomes
                - the planned target files and why they are in scope
                - the authoritative source docs or code surfaces for each update cluster
                - dependencies, review criteria, and consistency-sensitive areas
                - assumptions, open questions, and highest-risk documentation tasks

            [ ] Do not scaffold the planning document until the planning nucleus is stable enough
                for first-time-right drafting.

            [ ] Create the planning artifact: scaffold_artifact(artifact_type='planning', name='planning').
            [ ] Fill the scaffolded document with evidence-backed content.
                Use the template's optional sections where they materially improve the plan.
                Follow DOCUMENTATION_STANDARD.md while drafting the document.

            [ ] Self-check before the final user checkpoint:
                - If a task depends on an unsourced behavior claim, stop and ask instead of guessing.
                - If a task hides implementation work or redesign decisions,
                  move it out of documentation planning.
                - Verify that target files, authoritative sources, dependencies,
                  and review criteria are explicit.
                - Verify the draft follows DOCUMENTATION_STANDARD.md.

            [ ] Interaction checkpoint before internal QA: present the documentation task breakdown,
                source alignment, dependencies, review criteria, and unresolved questions to the user.
                If the scope or priorities are wrong, revise before review.

            [ ] Internal QA checkpoint before commit: invoke the qa agent with sub-role plan-verifier
                to review the plan.
                Ask QA as plan-verifier to verify:
                - alignment with the issue and the authoritative source docs or code surfaces
                - the plan stays documentation-only and does not hide implementation or redesign work
                - target files, dependencies, review criteria, and consistency risks are explicit
                - the plan is usable by the documentation phase
                Return PASS or FAIL with exact gaps.
                If model selection is supported in the current environment,
                prefer a model different from the active implementation agent.

            [ ] If internal QA returns FAIL, revise the plan and repeat the same QA checkpoint
                before committing.

            [ ] Commit: git_add_or_commit(workflow_phase='planning', message='Planning for #N')
            [ ] First push: git_push(set_upstream=True)  # creates remote tracking branch; do once on this branch
            [ ] Produce the hand-over required by the handover_template before ending the session.
          handover_template: |
            ### Planning → Documentation Hand-over
            #### Scope
            - Issue: #N
            - Planning focus: <one sentence>

            #### Review Targets
            - Documentation scope: <which docs or updates are planned and why>
            - Source alignment: <which authoritative docs or code surfaces the plan relies on>
            - Dependencies / review strategy: <what order, review criteria, or consistency risks matter>
            - Open questions: <what remains unresolved>

            #### Files
            - docs/development/issueN/planning.md (new)

            #### Stop-Go Proof
            - Planning doc committed

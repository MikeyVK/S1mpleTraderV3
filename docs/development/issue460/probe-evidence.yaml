semantic_observation_contract:
  scope: "Every successful baseline probe is indexed below. Unmentioned dimensions use these explicit defaults; overrides record inspected behavior."
  defaults:
    caller_field_consumed: "not_determined"
    expected_section_or_value: "not_determined"
    links_use_definition_closure: "not_applicable"
    issue_prefix: "not_applicable"
    checklist_text_and_state: "not_applicable"
    source_parse: "not_applicable"
    absolute_path_leak: true
    null_visible: "not_determined"
    collection_rendering: "not_applicable"
    output_profile_evidence: "not_exposed"
  enums:
    caller_field_consumed: ["yes", "partial", "no", "not_determined"]
    expected_section_or_value: ["present", "partial", "missing", "malformed", "not_determined"]
    links_use_definition_closure: ["closed", "unresolved", "not_applicable", "not_determined"]
    issue_prefix: ["correct", "double_prefixed", "not_applicable", "not_determined"]
    checklist_text_and_state: ["preserved", "changed", "missing", "not_applicable", "not_determined"]
    source_parse: ["passed", "failed", "not_applicable", "not_exposed"]
    null_visible: ["yes", "no", "not_determined"]
    collection_rendering: ["structural", "character_by_character", "not_applicable", "not_determined"]
    output_profile_evidence: ["passed", "failed", "unavailable", "not_exposed"]

